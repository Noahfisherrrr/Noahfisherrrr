<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img"><rect width="900" height="300" rx="14" fill="#0b0f13"/><text x="40" y="44" font-family="Consolas, Menlo, monospace" font-size="14" letter-spacing="3" fill="#2dd4bf">01 / ABOUT</text><rect x="40" y="56" width="48" height="3" rx="1.5" fill="#fbbf24"/><text x="40" y="96" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#e6edf3">I design interfaces, and build everything behind them.</text><text x="40" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#8b98a5">Write two or three sentences about what you build, how you think, and</text><text x="40" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#8b98a5">what you are working toward right now.</text><rect x="40" y="190" width="262" height="92" rx="10" fill="#121920" stroke="#26313c"/><text x="60" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#2dd4bf">8</text><text x="60" y="264" font-family="Consolas, Menlo, monospace" font-size="13" fill="#8b98a5">apps shipped</text><rect x="318" y="190" width="262" height="92" rx="10" fill="#121920" stroke="#26313c"/><text x="338" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#2dd4bf">30</text><text x="338" y="264" font-family="Consolas, Menlo, monospace" font-size="13" fill="#8b98a5">quality checks</text><rect x="596" y="190" width="262" height="92" rx="10" fill="#121920" stroke="#26313c"/><text x="616" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#2dd4bf">6 yrs</text><text x="616" y="264" font-family="Consolas, Menlo, monospace" font-size="13" fill="#8b98a5">in production</text></svg>