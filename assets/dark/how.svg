<svg xmlns="http://www.w3.org/2000/svg" width="900" height="276" viewBox="0 0 900 276" role="img"><rect width="900" height="276" rx="14" fill="#0b0f13"/><text x="40" y="44" font-family="Consolas, Menlo, monospace" font-size="14" letter-spacing="3" fill="#2dd4bf">03 / HOW I WORK</text><rect x="40" y="56" width="48" height="3" rx="1.5" fill="#fbbf24"/><text x="40" y="96" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#e6edf3">Process, not luck</text><circle cx="52" cy="135" r="13" fill="#2dd4bf"/><text x="52" y="140" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#0b0f13">1</text><text x="80" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6edf3">Design first: every screen starts in Figma, then becomes code.</text><circle cx="52" cy="177" r="13" fill="#2dd4bf"/><text x="52" y="182" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#0b0f13">2</text><text x="80" y="182" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6edf3">Monorepo workflow with shared components and strict types.</text><circle cx="52" cy="219" r="13" fill="#2dd4bf"/><text x="52" y="224" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#0b0f13">3</text><text x="80" y="224" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6edf3">AI-assisted engineering for speed, human review for quality.</text></svg>